spring.application.name=ticket
spring.profiles.active=dev
jwt.secret=CHANGE_ME_JWT_SECRET_AT_LEAST_32_CHARACTERS_LONG
spring.security.user.name=user
spring.security.user.password=CHANGE_ME_SPRING_USER_PASSWORD

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console